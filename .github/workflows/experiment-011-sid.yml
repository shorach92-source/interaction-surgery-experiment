name: Candidate 011 SID pilot

on:
  push:
    paths:
      - 'candidate_011/**'
      - '.github/workflows/experiment-011-sid.yml'
  workflow_dispatch:

jobs:
  sid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile pilot
        run: python -m py_compile candidate_011/sid_pilot.py
      - name: Verify secret
        run: |
          python - <<'PY'
          import os
          k=os.environ.get('OPENAI_API_KEY','')
          assert k.startswith('sk-'), 'OPENAI_API_KEY is missing'
          print('secret configured')
          PY
      - name: Run one-repetition SID falsification pilot
        run: |
          python candidate_011/sid_pilot.py \
            --model gpt-5.4-mini \
            --repetitions 1 \
            --output candidate_011/live_run
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: candidate-011-sid-${{ github.run_id }}
          path: candidate_011/live_run/
