name: Experiment 008 CPT pilot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/experiment-008-cpt.yml

permissions:
  contents: read

jobs:
  cpt-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile benchmark
        run: python -m py_compile candidate_008/cpt_benchmark.py
      - name: Mock plumbing sanity
        run: python candidate_008/cpt_benchmark.py --backend mock --model mock --seeds 2000 --output candidate_008/mock_results
      - name: Verify secret is configured
        run: test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)
      - name: Run one-seed live falsification pilot
        run: python candidate_008/cpt_benchmark.py --backend live --model gpt-5.4-mini --seeds 2000 --output candidate_008/live_results
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-008-cpt-${{ github.run_id }}
          path: |
            candidate_008/mock_results/
            candidate_008/live_results/
          if-no-files-found: warn
