name: Experiment 005 benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model
        required: true
        default: gpt-5.4-nano
        type: string
      repetitions:
        description: Repetitions per coalition subset (5 = 240 calls)
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sanity tests
        run: python -m unittest discover -s tests -v
      - name: Verify secret is configured
        run: test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)
      - name: Run live benchmark
        run: python experiment_005.py --backend live --model "${{ inputs.model }}" --repetitions "${{ inputs.repetitions }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-005-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

