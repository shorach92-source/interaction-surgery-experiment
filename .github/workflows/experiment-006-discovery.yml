name: Experiment 006 discovery screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/experiment-006-discovery.yml

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sanity tests
        run: python -m unittest discover -s tests -v
      - name: Verify secret is configured
        run: test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)
      - name: Run discovery screen
        run: python experiment_006.py --backend live --model gpt-5.4-nano --phase discovery --repetitions 1 --output results_006_discovery
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-006-discovery-${{ github.run_id }}
          path: results_006_discovery/
          if-no-files-found: warn
