name: Experiment 006 generic guard kill test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/experiment-006-discovery.yml

permissions:
  contents: read

jobs:
  generic-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sanity tests
        run: python -m unittest discover -s tests -v
      - name: Verify secret is configured
        run: test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)
      - name: Run generic calibration guard
        run: python experiment_006_generic_guard.py --model gpt-5.4-mini --scenario D3-02 --repetitions 5 --bootstrap-samples 5000 --output results_006_generic_guard
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-006-generic-guard-${{ github.run_id }}
          path: results_006_generic_guard/
          if-no-files-found: warn
