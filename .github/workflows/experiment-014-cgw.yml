name: Candidate 014 CGW kill test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/experiment-014-cgw.yml'

permissions:
  contents: read

jobs:
  cgw:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CGW_OUTPUT: candidate_014/run_live
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile pilot
        run: python -m py_compile candidate_014/cgw_pilot.py

      - name: Deterministic generator sanity
        run: |
          python - <<'PY'
          from candidate_014.cgw_pilot import build_scenarios
          ss = build_scenarios()
          assert len(ss) == 32
          assert len({s['id'] for s in ss}) == 32
          for s in ss:
              q = s['true_q']
              assert q['q10'] <= q['q50'] <= q['q90']
              assert len(s['history']) == 12
              assert s['scale'] > 0
          print('generator sanity: ok; scenarios=', len(ss))
          PY

      - name: Verify API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing" >&2
            exit 1
          fi

      - name: Run live CGW pilot
        run: python candidate_014/cgw_pilot.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-014-cgw-${{ github.run_id }}
          path: candidate_014/run_live
          if-no-files-found: warn
          retention-days: 30
