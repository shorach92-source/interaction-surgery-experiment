name: Experiment 006 payload validation

on:
  push:
    branches: [main]
    paths:
      - experiment_006.py
      - scenarios_v03.json
      - tests/test_experiment_006.py
      - .github/workflows/experiment-006.yml
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model
        required: true
        default: gpt-5.4-nano
        type: string
      phase:
        description: validation, discovery, or all
        required: true
        default: validation
        type: choice
        options:
          - validation
          - discovery
          - all
      repetitions:
        description: Repetitions per coalition subset
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sanity tests
        run: python -m unittest discover -s tests -v
      - name: Verify secret is configured
        run: test -n "$OPENAI_API_KEY" || (echo "Missing repository secret OPENAI_API_KEY" && exit 1)
      - name: Run live validation on push
        if: github.event_name == 'push'
        run: python experiment_006.py --backend live --model gpt-5.4-nano --phase validation --repetitions 1 --output results_006
      - name: Run requested live benchmark
        if: github.event_name == 'workflow_dispatch'
        run: python experiment_006.py --backend live --model "${{ inputs.model }}" --phase "${{ inputs.phase }}" --repetitions "${{ inputs.repetitions }}" --output results_006
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-006-results-${{ github.run_id }}
          path: results_006/
          if-no-files-found: warn
